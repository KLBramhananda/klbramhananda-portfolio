<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="Portfolio of Bramhananda K L — Full Stack Engineer building scalable enterprise software, ERPNext solutions, AI-powered procurement platforms, and SAP BTP integrations."
    />
    <title>Bramhananda K L — Software Engineer · Full Stack · ERPNext · SAP BTP · AI</title>
    <script>
      // Resolve the theme before first paint so no wrong-theme flash shows:
      // use the saved preference (light/dark/system), else the OS scheme.
      // The `.dark` class (and color-scheme) drive every CSS variable and
      // `dark:` utility below.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark;
          if (saved === "dark") dark = true;
          else if (saved === "light") dark = false;
          else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#0F172A" : "#F2F4F7";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
